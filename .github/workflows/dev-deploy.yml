name: Build and Deploy Dev Code
on:
    push:
        branches: ["dev"]
    pull_request:
        branches:
            - "main"

jobs:
    Deploy-Code:
        runs-on: ubuntu-latest

        environment:
            name: staging

        # Set environment variables for the job
        env:
            DATABASE_HOSTNAME: localhost
            DATABASE_PORT: 5432
            DATABASE_PASSWORD: postgres_2023
            DATABASE_NAME: postgres
            DATABASE_USERNAME: pocrapgsql
            SECRET_KEY: ${{secrets.SECRET_KEY}}
            ALGORITHM: ${{secrets.ALGORITHM}}
            ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
            DOCSHIELD_ADMIN_PASS: ${{secrets.DOCSHIELD_ADMIN_PASS}}
            DOCSHIELD_DEVELOPER_PASS: ${{secrets.DOCSHIELD_DEVELOPER_PASS}}
            DOCSHIELD_VIEWER_PASS: ${{secrets.DOCSHIELD_VIEWER_PASS}}
            DEV_DOCKER_PORT: ${{secrets.DEV_DOCKER_PORT}}
            PROD_DOCKER_PORT: ${{secrets.PROD_DOCKER_PORT}}

        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            postgres:
                # Docker Hub image
                image: postgres
                # Provide the password for postgres
                env:
                    POSTGRES_USER: pocrapgsql
                    POSTGRES_PASSWORD: postgres_2023
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                # Set health checks to wait until postgres has started
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: pulling git repo
              uses: actions/checkout@v6

            - name: Install python version 3.12
              uses: actions/setup-python@v6
              with:
                python-version: "3.12"

            - name: checking python version
              run: |
                echo "Python version: $(python --version)"
            - run: echo "🍏 This job's status is ${{ job.status }}."

            - name: update pip
              run: python -m pip install --upgrade pip

            - name: install uv
              run: python -m pip install uv
            - name: sync dependencies with uv
              run: |
                # create/sync virtualenv according to pyproject.lock / uv config
                uv sync --frozen --no-cache

            - name: Install psql client
              run: sudo apt-get install -y postgresql-client
            - name: Setup .pgpass file
              run: |
                # Format: hostname:port:database:username:password
                echo "${{vars.DATABASE_HOSTNAME}}:${{vars.DATABASE_PORT}}:${{vars.DATABASE_NAME}}_test:${{vars.DATABASE_USERNAME}}:${{vars.DATABASE_PASSWORD}}" > ~/.pgpass

                # Critical: PostgreSQL ignores the file if permission are too open
                chmod 600 ~/.pgpass
                cat ~/.pgpass

            - name: Check PostgesQL Version
              run: |
                psql -h ${{vars.DATABASE_HOSTNAME}} -p ${{vars.DATABASE_PORT}} -U ${{vars.DATABASE_USERNAME}} -d ${{vars.DATABASE_NAME}}_test -c "SELECT current_database(), version();"

            - name: run tests inside uv environment
              run:
                # run pytest inside the uv-managed environment
                uv run pytest -q --disable-warnings -s
