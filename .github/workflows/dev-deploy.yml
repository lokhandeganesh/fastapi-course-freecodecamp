name: Build and Deploy Dev Code
on:
    push:
        branches: ["dev"]
    pull_request:
        branches:
            - "main"

jobs:
    Deploy-Code:
        runs-on: ubuntu-latest

        environment:
            name: staging

        # Set environment variables for the job
        env:
            DATABASE_HOSTNAME: ${{secrets.DATABASE_HOSTNAME}}
            DATABASE_PORT: ${{secrets.DATABASE_PORT}}
            DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
            DATABASE_NAME: ${{secrets.DATABASE_NAME}}
            DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
            SECRET_KEY: ${{secrets.SECRET_KEY}}
            ALGORITHM: ${{secrets.ALGORITHM}}
            ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
            ADMIN_PASS: ${{secrets.ADMIN_PASS}}

        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            postgres:
                # Docker Hub image
                image: postgres
                # Provide the password for postgres
                env:
                    POSTGRES_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
                    POSTGRES_DB: ${{secrets.DATABASE_NAME}}_test
                ports:
                    - 5432:5432
                # Set health checks to wait until postgres has started
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: pulling git repo
              uses: actions/checkout@v6

            - name: Install python version 3.12
              uses: actions/setup-python@v6
              with:
                python-version: "3.12"

            - name: checking python version
              run: |
                echo "Python version: $(python --version)"
            - run: echo "🍏 This job's status is ${{ job.status }}."

            - name: update pip
              run: python -m pip install --upgrade pip

            - name: install uv
              run: python -m pip install uv
            - name: sync dependencies with uv
              run: |
                # create/sync virtualenv according to pyproject.lock / uv config
                uv sync --frozen --no-cache

            - name: Install psql client
              run: sudo apt-get install -y postgresql-client
            - name: Check PostgesQL Version
              run: |
                psql -h ${{secrets.DATABASE_HOSTNAME}} -p ${{secrets.DATABASE_PORT}} -U ${{secrets.DATABASE_USERNAME}} -d ${{secrets.DATABASE_NAME}}_test -c "SELECT version();"

            - name: run tests inside uv environment
              run:
                # run pytest inside the uv-managed environment
                uv run pytest -q --disable-warnings



